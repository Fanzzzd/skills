name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo invariants
        run: node scripts/check.mjs
      - name: Plugin manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
